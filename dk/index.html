      letter-spacing: 0.06em;

    }

      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 100%;

      background: var(--pink);
      transform: scaleX(0);

      transition: transform 0.25s ease;

      transform: scaleX(1);

      letter-spacing: 0.06em;
      line-height: 1;

      font-size: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      text-transform: uppercase;
    }

    .language-switch .language-current {
      color: var(--pink);
    }

    .language-switch .language-separator {
      color: var(--text);

    .language-switch a {

      text-decoration: none;
      opacity: 0.6;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    .language-switch a:hover {
      color: var(--pink);
      opacity: 1;
    }

    .language-switch a::after {
      display: none;
    }

    .hamburger-icon {

    }

    .hamburger-icon::before,

      position: absolute;
      left: 0;

    .hamburger-icon::before {
      top: -8px;
    }

    .hamburger-icon::after {
      top: 8px;
    }
